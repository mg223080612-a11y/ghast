# 컴퓨터용 프로그램 만들어서 배포하기 (Windows exe + 맥 앱)
# 맥 앱은 맥에서만 만들 수 있어서 (윈도우에서는 electron-builder 가 막는다) GitHub 의 맥·윈도우 컴퓨터에서 각각 만든다.
#
# 새 버전 내기:
#   1. package.json 의 version 을 올린다 (예: 2.0.0 → 2.0.1). 게임 처음 화면 구석의 'v2.0.1' 도 이 값이다
#   2. 커밋·push 한 뒤 같은 이름의 태그를 올린다:  git tag v2.0.1 && git push origin v2.0.1
#   3. 이 workflow 가 exe 2개(setup·portable) + 맥 zip 2개(arm64·x64)를 만들어
#      Releases 의 'v2.0.1' 에 올리고 'Latest' 로 표시한다.
#      팀원 안내 주소는 늘 같다: https://github.com/mg223080612-a11y/ghast/releases/latest
#
# 시험으로 만들기만 하려면: GitHub → Actions → 컴퓨터용 프로그램 배포 → Run workflow
#   (태그가 아니면 Releases 에는 올리지 않고, 그 실행 화면의 Artifacts 에서 받을 수 있다)
name: 컴퓨터용 프로그램 배포

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            script: build:exe
            files: |
              release/*-setup.exe
              release/*-portable.exe
            name: windows
          - os: macos-latest
            script: build:mac
            files: release/*-mac-*.zip
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 태그 이름(v2.0.0)과 package.json 의 version(2.0.0)이 다르면 멈춘다 → 파일 이름·화면 버전이 어긋나는 일을 막음
      - name: 태그와 package.json 버전 맞는지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::태그 ${GITHUB_REF_NAME} 와 package.json 버전 ${pkg} 이 다릅니다"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Releases 에 파일을 올리기 위해
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Releases 에 올리고 'Latest' 로 표시
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 가스트 사격 ${{ github.ref_name }}
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*-setup.exe
            dist/*-portable.exe
            dist/*-mac-arm64.zip
            dist/*-mac-x64.zip
          body: |
            게임 처음 화면 오른쪽 아래에 **${{ github.ref_name }}** 이 보이면 최신입니다.
            (버전이 안 보이면 옛 앱입니다. 옛 앱은 랭킹 기록이 저장되지 않으니 꼭 바꿔 주세요)

            **어떤 파일을 받나요?**
            | 컴퓨터 | 파일 |
            |---|---|
            | Windows (설치) | `-setup.exe` — 설치하면 바탕화면에 '가스트 사격' 아이콘 |
            | Windows (설치 없이, USB용) | `-portable.exe` |
            | 애플 실리콘(M1~M4) 맥 | `-mac-arm64.zip` |
            | 인텔 맥 | `-mac-x64.zip` |

            - 예전 앱은 지우고 새로 설치하세요. 총 보정·1P/2P·조준점 같은 설정은 그대로 이어집니다.
            - Windows 에서 처음 실행할 때 "Windows의 PC 보호" 파란 창이 뜨면: **추가 정보 → 실행**
            - 맥에서 처음 열 때 "악성 코드가 없음을 확인할 수 없습니다" 경고가 뜨면: **완료** → 시스템 설정 → 개인정보 보호 및 보안 → 맨 아래 **그래도 열기**
            - 랭킹 저장에는 인터넷이 필요합니다. 인터넷 없이 하면 미리 받아 둔 예비 표로 3판까지만 나중에 저장됩니다.

            자세한 설명: 저장소 README 의 '컴퓨터용 프로그램'
