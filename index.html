<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>가스트 사격 — Ghast Shooting</title>
  <!-- 한글 픽셀 폰트(갈무리 11 Bold)는 fonts/ 폴더에 들어 있어 인터넷 없이도 나온다. 미리 받아 두기 -->
  <link rel="preload" href="fonts/Galmuri11-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 게임 화면 전체를 그리는 캔버스 -->
  <canvas id="bg"></canvas>   <!-- 움직이지 않는 네더 배경 (한 번만 그림) -->
  <canvas id="game"></canvas> <!-- 가스트·효과·글자 (매 프레임) -->

  <!-- 운영 버튼: 처음 화면 버튼은 처음 화면 말고 어디서나, 나머지는 처음 화면/결과 화면에서만 -->
  <div id="corner-buttons">
    <button type="button" id="btn-home" title="처음 화면으로 (C)">🏠 처음 화면</button>
    <button type="button" id="btn-gunsetup" title="총 연결 (G) — 2인 대결용 1P/2P 지정">🔫 총 연결</button>
    <button type="button" id="btn-aimtest" title="총 조준 테스트 (T)">🎯 총 테스트</button>
    <button type="button" id="btn-fullscreen" title="전체화면 (F)">⛶ 전체화면</button>
    <button type="button" id="btn-settings" title="설정 (S)">⚙ 설정</button>
  </div>

  <!-- 운영자 설정 창 -->
  <div id="settings" hidden>
    <form id="settings-form">
      <h2>게임 설정</h2>
      <div class="grid">
        <label>제한 시간 (초)<input type="number" name="gameSeconds" min="10" max="600" step="5"></label>
        <label>가스트 처치 점수<input type="number" name="killPoints" min="0" max="20"></label>
        <label>보너스까지 새로 모을 점수 (쉼표로, 마지막 값 반복)<input type="text" name="bonusGaps" placeholder="30, 50, 70"></label>
        <label>화염구 반사 점수<input type="number" name="deflectPoints" min="0" max="20"></label>
        <label>보너스 시간 (초)<input type="number" name="bonusSeconds" min="0" max="300" step="1"></label>
        <label>화염구 피격 감점<input type="number" name="hitPenalty" min="0" max="20"></label>
        <label>배경 잘못 맞히면 감점<input type="number" name="missPenalty" min="0" max="20"></label>
        <label>가스트 놓치면 감점<input type="number" name="escapePenalty" min="0" max="20"></label>
        <label>레벨당 가스트 빨라지기 (%)<input type="number" name="levelSpeedUp" min="0" max="100" step="5"></label>
        <label>가스트의 눈물 기준 점수<input type="number" name="rewardScore" min="0" max="999"></label>
        <label>난이도 (0.5 쉬움 ~ 2 어려움)<input type="number" name="difficulty" min="0.3" max="3" step="0.1"></label>
        <label>판정 여유 (%)<input type="number" name="hitPadding" min="0" max="60" step="5"></label>
        <label>가스트 크기 (%)<input type="number" name="ghastScale" min="50" max="200" step="10"></label>
        <label>화질 (버벅이면 '가볍게')
          <select name="quality">
            <option value="normal">보통 (권장)</option>
            <option value="light">가볍게 (저사양 노트북)</option>
            <option value="sharp">선명하게 (느릴 수 있음)</option>
          </select>
        </label>
        <label>소리 크기 (0 ~ 1)<input type="number" name="volume" min="0" max="1" step="0.1"></label>
        <label>입력 장치
          <select name="inputMode">
            <option value="gun">라이트건 (GUN4IR · 마우스)</option>
            <option value="touch">프로젝터 터치 센서</option>
          </select>
        </label>
        <label>조준점
          <select name="aimMode">
            <option value="big">큰 조준점 (과녁 보이기, 권장)</option>
            <option value="hidden">게임 중 숨김 (과녁 없음)</option>
            <option value="small">작은 마우스 십자</option>
          </select>
        </label>
        <label>큰 조준점 크기 (%)<input type="number" name="aimSize" min="50" max="300" step="10"></label>
        <label>터치 중복 무시 (ms, 터치 모드에서만)<input type="number" name="debounceMs" min="0" max="500" step="10"></label>
        <label class="check"><input type="checkbox" name="showTouches"> 터치 위치 표시</label>
        <label class="check"><input type="checkbox" name="showFps"> FPS 표시 (속도 확인용)</label>
        <label class="check"><input type="checkbox" name="autoQuality"> 버벅이면 자동으로 가볍게</label>
        <label class="check"><input type="checkbox" name="fewEffects"> 효과 줄이기 (조각 적게·빛 번짐 끄기)</label>
      </div>
      <div class="actions">
        <button type="button" id="settings-reset">기본값</button>
        <button type="button" id="settings-close">취소</button>
        <button type="submit" class="primary">저장</button>
      </div>
      <h3>랭킹 관리</h3>
      <p class="keys" id="rank-where"></p>
      <label class="admin-key">관리자 키 (기록 삭제용)<input type="password" name="adminKey" autocomplete="off"></label>
      <div id="rank-admin"></div>
      <div class="actions">
        <button type="button" id="rank-clear">랭킹 전체 삭제</button>
      </div>
      <p class="keys">
        단축키 — <b>Space</b> 시작 · <b>R</b> 랭킹 · <b>P</b> 일시정지 · <b>Q</b> 처음 화면 · <b>F</b> 전체화면 · <b>M</b> 소리 끄기 · <b>S</b> 설정
      </p>
    </form>
  </div>

  <!-- 게임 시작 전 닉네임 입력 -->
  <div id="name-entry" class="overlay" hidden>
    <form id="name-form" autocomplete="off">
      <h2 id="name-title">닉네임을 입력하세요</h2>
      <input name="nickname" maxlength="12" placeholder="예: 가스트헌터" spellcheck="false">
      <!-- 2인 대결일 때만 보이는 2P 이름 칸 -->
      <input name="nickname2" maxlength="12" placeholder="2P 이름" spellcheck="false" hidden>
      <p class="hint" id="name-hint">랭킹에 이 이름으로 기록돼요 (최대 12자)</p>
      <div class="actions">
        <button type="button" id="name-cancel">취소</button>
        <button type="submit" class="primary">시작!</button>
      </div>
    </form>
  </div>

  <script src="game.js"></script>
</body>
</html>
